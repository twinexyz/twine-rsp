[workspace.package]
[package]
name = "rsp-client"
edition = "2021"
description = ""

[dependencies]
bincode = "1.3.3"
serde_json = "1.0.94"

# workspace
revm-primitives = { version = "18.0.0", features = ["serde"], default-features = false }
rsp-client-executor = { path = "../../crates/executor/client", default-features = false, optional = true }

# sp1
sp1-zkvm = { git = "https://github.com/twinexyz/sp1.git", branch = "v5.0.0-twine" }

reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1", default-features = false, features = ["serde"] }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1", default-features = false, features = ["eip1186", "serde"] }
twine-types = { git = "https://github.com/twinexyz/weaver.git", tag = "v.0.0.1-beta" }
twine-utils = { git = "https://github.com/twinexyz/weaver.git", tag = "v.0.0.1-beta" }

# Statically turns off logging
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }

[features]
testnet = ["rsp-client-executor/testnet"]
devnet = ["rsp-client-executor/devnet"]
mainnet = ["rsp-client-executor/mainnet"]

[patch.crates-io]
# Precompile patches
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-4.0.0", package = "sha2" }
bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-5.0.0", package = "substrate-bn" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-4.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-5.0.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-5.0.0" }
ethereum_hashing = { git = "https://github.com/Atamanov/ethereum_hashing.git" }
