[package]
name = "eth-proofs"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.7", features = ["derive", "env"] }
dotenv = "0.15.0"
eyre = "0.6.12"
futures = "0.3"
reqwest = { workspace = true, features = ["json"] }
reqwest-middleware = { version = "0.3.3", features = ["json"] }
reqwest-retry = "0.6.1"
serde.workspace = true
serde_json.workspace = true
time = "0.3.37"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3.18"
url.workspace = true

# workspace
rsp-client-executor = { workspace = true, features = ["mainnet"] }
rsp-host-executor = { workspace = true, features = ["alerting"] }
rsp-primitives.workspace = true
rsp-provider.workspace = true

# sp1
sp1-sdk.workspace = true

# alloy
alloy-chains.workspace = true
alloy-provider = { workspace = true, features = ["ws"] }
alloy-rpc-client.workspace = true
alloy-transport.workspace = true
alloy-transport-ws.workspace = true

[build-dependencies]
sp1-build.workspace = true
