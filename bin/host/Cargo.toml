[package]
name = "rsp"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.7", features = ["derive", "env"] }
csv = "1.1"
dotenv = "0.15.0"
eyre = "0.6.12"
serde.workspace = true
serde_json.workspace = true
strum = "0.26"
tokio.workspace = true
tracing-subscriber = "0.3.18"
url.workspace = true

# workspace
rsp-client-executor = { workspace = true, default-features = false, optional = true }
rsp-host-executor = { workspace = true, default-features = false, optional = true }
rsp-primitives.workspace = true
rsp-provider.workspace = true

# alloy
alloy-chains.workspace = true
alloy-consensus.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true

# reth
reth-primitives-traits.workspace = true
reth-trie-common.workspace = true

# revm
revm-bytecode.workspace = true

# sp1
sp1-core-executor.workspace = true
sp1-sdk.workspace = true

# weaver dependency
twine-constants.workspace = true
twine-rpc.workspace = true

[dev-dependencies]
alloy-network.workspace = true
madato = "0.7.0"
rsp-client-executor.workspace = true
serde_json = "1.0"
thousands = "0.2.0"

[build-dependencies]
sp1-build.workspace = true

[features]
default = ["mainnet"]
devnet = ["rsp-client-executor/devnet", "rsp-host-executor/devnet"]
testnet = ["rsp-client-executor/testnet", "rsp-host-executor/testnet"]
mainnet = ["rsp-client-executor/mainnet", "rsp-host-executor/mainnet"]
